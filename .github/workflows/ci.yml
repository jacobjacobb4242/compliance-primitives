name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace-members:
    name: workspace members check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every contracts/ and examples/ crate is a workspace member
        run: ./scripts/check-workspace-members.sh

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --verbose
      - name: Run doc tests
        run: cargo test --workspace --doc --verbose

  feature-flags:
    name: cargo check (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - --no-default-features
          - --all-features
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check workspace with ${{ matrix.features }}
        run: cargo check --workspace ${{ matrix.features }}

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  budget-regression:
    name: budget regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run budget regression tests
        run: cargo test --workspace budget_regression -- --nocapture

  wasm-build:
    name: wasm32v1-none build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      # Explicitly cache the wasm32v1-none target directory in addition to the
      # native target/ tree.  Swatinem/rust-cache@v2 keys on the host triple by
      # default; the cross-compiled wasm target lives in a separate subdirectory
      # (target/wasm32v1-none/) and may not be included in the default cache
      # entry depending on the runner's Rust sysroot layout.  Setting
      # `cache-targets: "true"` and adding a shared-key suffix scoped to the
      # wasm target ensures the release build artifacts are preserved between
      # runs and avoids a full rebuild on every push.
      - name: Cache cargo (wasm target)
        uses: Swatinem/rust-cache@v2
        with:
          # Scope this cache entry to the wasm target so it doesn't collide
          # with the native-target entries used by the test/clippy jobs.
          shared-key: wasm32v1-none
          # Cache the wasm release artifacts explicitly.
          cache-targets: "true"
      - name: Build contracts to wasm
        run: cargo build --workspace --target wasm32v1-none --release

  wasm-size-budget:
    name: wasm size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      # Use the same shared-key as the wasm-build job so this job can reuse
      # the cached wasm32v1-none release artifacts rather than rebuilding them.
      - name: Cache cargo (wasm target)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm32v1-none
          cache-targets: "true"
      - name: Check wasm binary sizes against budget
        run: bash scripts/check-wasm-size.sh

  accessibility:
    name: accessibility audit (web/)
    runs-on: ubuntu-latest
    # Non-blocking for now (per the issue that introduced this job): a
    # failure here is reported but doesn't fail the overall CI run. Once
    # the audit has been stable for a while, remove continue-on-error to
    # make it blocking like the other jobs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audit tooling (downloads Puppeteer's bundled Chromium)
        run: npm ci
      - name: Run axe-core against web/index.html
        run: node scripts/check-accessibility.mjs

  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  docs-interfaces-diff:
    name: docs/interfaces diff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install stellar CLI
        run: |
          curl -s https://raw.githubusercontent.com/stellar/stellar-cli/master/install.sh | bash
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Regenerate interface docs
        run: ./scripts/regenerate-docs.sh
      - name: Check for differences
        run: |
          # `git status --porcelain` also catches untracked files (e.g. a new
          # contract whose interface was generated but never committed).
          if [ -z "$(git status --porcelain docs/interfaces/)" ]; then
            echo "✓ docs/interfaces is up to date"
          else
            echo "✗ docs/interfaces is out of date. Run ./scripts/regenerate-docs.sh and commit the changes."
            git status --porcelain docs/interfaces/
            git diff docs/interfaces/
            exit 1
          fi

  examples-test:
    name: test all examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Enumerate and test examples
        run: |
          set -e
          EXAMPLES_DIR="examples"
          FAILED_CRATES=()

          echo "Testing all example crates..."
          for dir in "$EXAMPLES_DIR"/*; do
            if [ -d "$dir" ]; then
              CRATE_NAME=$(basename "$dir")
              if [ -f "$dir/Cargo.toml" ]; then
                echo "Testing $CRATE_NAME..."
                if ! cargo test -p "$CRATE_NAME" --verbose; then
                  FAILED_CRATES+=("$CRATE_NAME")
                fi
              else
                echo "ERROR: Directory $dir exists but has no Cargo.toml"
                exit 1
              fi
            fi
          done

          if [ ${#FAILED_CRATES[@]} -ne 0 ]; then
            echo "ERROR: The following example crates failed tests:"
            printf '  - %s\n' "${FAILED_CRATES[@]}"
            exit 1
          fi

          echo "All example crates passed tests."

  dead-code-allows:
    name: dead_code allow lint
    runs-on: ubuntu-latest
    # Fail if any #[allow(dead_code)] added in this PR is missing a linked
    # issue reference (#NNN) in the same line or the line immediately above.
    # This prevents untracked dead code from silently accumulating.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base branch for diff
        run: git fetch origin main
      - name: Check new #[allow(dead_code)] for linked issue references
        run: bash scripts/check-dead-code-allows.sh

  changelog-version-sync:
    name: changelog version sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check CHANGELOG.md and version are in sync
        run: ./scripts/check-changelog.sh

  contract-line-count:
    name: contract line-count guideline check
    runs-on: ubuntu-latest
    # Warning only — a contract growing past ~300 lines gets a visible nudge
    # without blocking the PR.  Set HARD_FAIL=1 (or remove continue-on-error)
    # once the guideline is enforced more strictly.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Flag contracts over the ~300-line guideline
        run: bash scripts/check-contract-line-count.sh

  semver-checks:
    name: cargo semver-checks
    runs-on: ubuntu-latest
    # Check for accidental breaking API changes in public crates.
    # Currently scopes to compliance-pausable (a publishable shared crate).
    # Add --package flags for additional crates as they become public.
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks
      - name: Check semver compliance for compliance-pausable
        run: cargo semver-checks check-release --package compliance-pausable
