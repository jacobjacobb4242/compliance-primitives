[package]
name = "jurisdiction-flag"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Soroban contract attaching an issuer-controlled jurisdiction code to an address."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
compliance-pausable = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
compliance-pausable = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "compliance-pausable/testutils"]
