[package]
name = "multisig-governed-allowlist"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
multisig-admin = { path = "../../contracts/multisig-admin", features = ["testutils"] }
allowlist-token = { path = "../../contracts/allowlist-token", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
